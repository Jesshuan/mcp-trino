version: '3.8'

services:
  trino:
    image: 'trinodb/trino:424'
    container_name: trino
    ports:
      - '8082:8080'
    volumes:
      - ./trino-conf:/etc/trino
    networks:
      - trino-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  trino-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trino-mcp
    ports:
      - '8081:8080'
    environment:
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - TRINO_USER=trino
      - TRINO_CATALOG=memory
      - TRINO_SCHEMA=default
      - TRINO_SCHEME=http
      # DEV-ONLY: local Trino ships no TLS certificate. This flag only takes
      # effect when TRINO_SCHEME=https — if you switch this stack to https,
      # certificate verification stays off. Never copy this into production.
      - TRINO_SSL_INSECURE=true
      - MCP_TRANSPORT=http
      - MCP_PORT=8080
      # DEV-ONLY: local test stack has no authentication. The server refuses
      # to start an unauthenticated HTTP endpoint unless this is set.
      # Remove this and enable OAuth (OAUTH_ENABLED=true) for any real deployment.
      - MCP_ALLOW_UNAUTHENTICATED_HTTP=true
      - TRINO_ALLOWED_SCHEMAS=memory.analytics,memory.marts,memory.staging
    depends_on:
      trino:
        condition: service_healthy
    networks:
      - trino-net

networks:
  trino-net:
    driver: bridge 
